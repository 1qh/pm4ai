name: release
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun action
      - name: release if version bumped
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun tools/release.ts
